<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1820">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>E.V.A</title>
<style>
  :root { --ink:#0d1820; --panel:#14242e; --line:#27414f; --text:#e4edf0; --muted:#8aa3ae; --glow:#4fd6dc; --warm:#f2b45a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ink); color: var(--text); font: 16px/1.5 system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .core { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--glow); position: relative; flex: none; }
  .core::before, .core::after { content: ""; position: absolute; border-radius: 50%; }
  .core::before { inset: 6px; border: 1px solid var(--glow); opacity: .6; }
  .core::after { inset: 14px; background: var(--glow); opacity: .85; }
  .core.listening { border-color: var(--warm); animation: pulse 1.2s ease-out infinite; }
  .core.listening::after { background: var(--warm); }
  .core.speaking { animation: pulse .9s ease-out infinite; }
  .core.thinking::before { animation: spin 1.4s linear infinite; border-style: dashed; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(79,214,220,.55); } 100% { box-shadow: 0 0 0 16px rgba(79,214,220,0); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .core, .core::before { animation: none !important; } }
  h1 { font-size: 19px; margin: 0; letter-spacing: .06em; }
  .status { color: var(--muted); font-size: 13px; }
  .grow { flex: 1; }
  header { flex-wrap: wrap; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  input[type=range] { padding: 0; }
  button, input, select { font: inherit; color: var(--text); }
  button { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 13px; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
  button.on { border-color: var(--glow); color: var(--glow); }
  details { padding: 0 14px; border-bottom: 1px solid var(--line); }
  summary { cursor: pointer; padding: 8px 0; color: var(--muted); font-size: 14px; }
  .set { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; padding: 4px 0 12px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  label input, label select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  #log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: min(720px, 90%); padding: 10px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .me { align-self: flex-end; background: #1d3a47; border-bottom-right-radius: 4px; }
  .ai { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .src { color: var(--muted); font-size: 13px; }
  .sys { align-self: center; color: var(--muted); font-size: 14px; text-align: center; max-width: 620px; }
  .sys.err { color: var(--warm); }
  form { display: flex; gap: 8px; padding: 10px 14px 14px; border-top: 1px solid var(--line); }
  #text { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  #mic.live { background: var(--warm); color: #1b1203; border-color: var(--warm); }
</style>
</head>
<body>
<header>
  <div class="core" id="core" aria-hidden="true"></div>
  <div><h1>E.V.A</h1><div class="status" id="status">Ready</div></div>
  <div class="grow"></div>
  <div class="btns">
    <button type="button" id="hf" aria-pressed="false">Hands-free: off</button>
    <button type="button" id="spk" class="on" aria-pressed="true">Voice: on</button>
  </div>
</header>

<details id="set">
  <summary>Settings (start here)</summary>
  <div class="set">
    <label>Gemini API key (stays on this device)<input id="key" type="password" autocomplete="off" placeholder="Paste your free key"></label>
    <label>Model<input id="model" value="gemini-2.5-flash"></label>
    <label>Web access
      <select id="search">
        <option value="google">Google Search (if your free key allows it)</option>
        <option value="wiki">Wikipedia lookup (always free)</option>
        <option value="off">Off</option>
      </select>
    </label>
    <label>Your name<input id="uname" placeholder="Optional"></label>
    <label>City (for weather)<input id="city" placeholder="e.g. Pune"></label>
    <label>Voice<select id="voice"><option value="">Phone default</option></select></label>
    <label>Speech speed<input id="rate" type="range" min="0.7" max="1.4" step="0.1" value="1"></label>
  </div>
</details>

<div id="log" aria-live="polite"></div>

<form id="form">
  <button type="button" id="mic" aria-label="Talk to E.V.A">Talk</button>
  <input id="text" autocomplete="off" placeholder="Ask anything, or: note ..., remind me in 10 minutes to ...">
  <button type="submit">Send</button>
</form>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var log = $("log"), core = $("core"), statusEl = $("status");
  var hist = load("eva_hist", []), speakOn = true, hands = false, voices = [];

  function load(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  var notes = load("eva_notes", []);
  var facts = load("eva_facts", []);
  var fields = { key: "eva_key", model: "eva_model", search: "eva_search", uname: "eva_name", city: "eva_city", rate: "eva_rate" };
  Object.keys(fields).forEach(function (id) {
    $(id).value = load(fields[id], $(id).value);
    $(id).addEventListener("change", function () { save(fields[id], $(id).value.trim()); });
  });

  function setState(s, label) { core.className = "core" + (s ? " " + s : ""); statusEl.textContent = label || "Ready"; }
  var trans = load("eva_trans", []);
  function add(cls, text, noSave) {
    var d = document.createElement("div"); d.className = cls === "sys" || cls === "sys err" ? cls : "msg " + cls;
    d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight;
    if ((cls === "me" || cls === "ai") && !noSave) { trans.push({ c: cls, t: text }); trans = trans.slice(-60); save("eva_trans", trans); }
    return d;
  }

  // ---- voice out ----
  function speak(t) {
    if (!speakOn || !("speechSynthesis" in window) || !t) { afterSpeak(); return; }
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(t.replace(/[*#_`]/g, ""));
    var vn = $("voice").value;
    if (vn) { for (var i = 0; i < voices.length; i++) { if (voices[i].name === vn) { u.voice = voices[i]; u.lang = voices[i].lang; } } }
    u.rate = parseFloat($("rate").value) || 1;
    u.onstart = function () { setState("speaking", "Speaking"); };
    u.onend = u.onerror = function () { setState("", "Ready"); afterSpeak(); };
    speechSynthesis.speak(u);
  }
  $("spk").onclick = function () {
    speakOn = !speakOn; this.classList.toggle("on", speakOn);
    this.setAttribute("aria-pressed", String(speakOn)); this.textContent = "Voice: " + (speakOn ? "on" : "off");
    if (!speakOn && "speechSynthesis" in window) speechSynthesis.cancel();
  };

  // ---- voice picker ----
  function loadVoices() {
    if (!("speechSynthesis" in window)) return;
    voices = speechSynthesis.getVoices();
    var sel = $("voice"), saved = load("eva_voice", "");
    sel.innerHTML = "";
    var d = document.createElement("option"); d.value = ""; d.textContent = "Phone default"; sel.appendChild(d);
    voices.forEach(function (v) {
      var o = document.createElement("option"); o.value = v.name; o.textContent = v.name + " (" + v.lang + ")"; sel.appendChild(o);
    });
    sel.value = saved;
  }
  if ("speechSynthesis" in window) { speechSynthesis.onvoiceschanged = loadVoices; loadVoices(); }
  $("voice").onchange = function () { save("eva_voice", this.value); };

  // ---- hands-free: listen again automatically after E.V.A finishes speaking ----
  function startListen() { if (rec && !live) { try { rec.start(); } catch (e) {} } }
  function afterSpeak() { if (hands) setTimeout(startListen, 500); }
  $("hf").onclick = function () {
    if (!rec) { add("sys err", "Hands-free needs voice input. Use Chrome on your phone."); return; }
    hands = !hands; this.classList.toggle("on", hands); this.setAttribute("aria-pressed", String(hands));
    this.textContent = "Hands-free: " + (hands ? "on" : "off");
    if (hands) { if (!speakOn) $("spk").click(); startListen(); } else if (live) rec.stop();
  };

  // ---- voice in ----
  var Rec = window.SpeechRecognition || window.webkitSpeechRecognition, rec = null, live = false;
  if (Rec) {
    rec = new Rec(); rec.lang = "en-US"; rec.interimResults = false;
    rec.onstart = function () { live = true; $("mic").classList.add("live"); $("mic").textContent = "Stop"; setState("listening", "Listening"); };
    rec.onend = function () { live = false; $("mic").classList.remove("live"); $("mic").textContent = "Talk"; if (core.className.indexOf("thinking") < 0) setState("", "Ready"); };
    rec.onerror = function (e) {
      if (e.error === "no-speech") { add("sys", "I did not hear anything. Press Talk to try again."); return; }
      if (e.error === "aborted") return;
      add("sys err", "Microphone problem: " + e.error + ". Allow microphone access for this site.");
    };
    rec.onresult = function (e) { handle(e.results[0][0].transcript); };
  }
  $("mic").onclick = function () {
    if (!rec) { add("sys err", "Voice input is not supported in this browser. Use Chrome, or type."); return; }
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    if (live) rec.stop(); else { try { rec.start(); } catch (e) {} }
  };

  // ---- notes and reminders ----
  function say(t) { add("ai", t); speak(t); }
  function commands(t) {
    var m = t.match(/^remind me in (\d+)\s*(second|minute|min|hour)s?\s*(?:to|that|about)?\s*(.*)$/i);
    if (m) {
      var n = +m[1], u = m[2].toLowerCase(), what = m[3] || "your reminder";
      var ms = n * (u.indexOf("sec") === 0 ? 1000 : u.indexOf("h") === 0 ? 3600000 : 60000);
      try { if (window.Notification && Notification.permission === "default") Notification.requestPermission(); } catch (e) {}
      setTimeout(function () {
        say("Reminder: " + what);
        try { if (window.Notification && Notification.permission === "granted") new Notification("E.V.A", { body: what }); } catch (e) {}
      }, ms);
      say("Okay, I will remind you in " + n + " " + u + (n === 1 ? "" : "s") + ": " + what + ". Keep this app open.");
      return true;
    }
    m = t.match(/^(?:my name is|call me|i am called)\s+([a-z][a-z' -]{0,30})$/i);
    if (m) { $("uname").value = m[1].trim(); save("eva_name", m[1].trim()); say("Nice to meet you, " + m[1].trim() + "."); return true; }
    m = t.match(/^i live in\s+([a-z][a-z .'-]{1,40})$/i);
    if (m) { $("city").value = m[1].trim(); save("eva_city", m[1].trim()); say("Got it. I will use " + m[1].trim() + " for the weather."); return true; }
    m = t.match(/^(?:remember|learn|keep in mind)\s+that\s+(.+)$/i);
    if (m) { facts.push(m[1]); save("eva_facts", facts); say("Got it. I will remember that " + m[1] + "."); return true; }
    if (/^(what do you (know|remember) about me|show (my )?(memory|facts))$/i.test(t)) {
      say(facts.length ? "Here is what I remember about you:\n" + facts.map(function (x, i) { return (i + 1) + ". " + x; }).join("\n") : "I do not know much about you yet. Say: remember that, then a fact about you.");
      return true;
    }
    m = t.match(/^forget\s+(?:fact\s+)?(\d+)$/i);
    if (m) {
      var k = +m[1] - 1;
      if (facts[k]) { var gone = facts.splice(k, 1)[0]; save("eva_facts", facts); say("Forgot: " + gone); } else say("I do not have a fact with that number.");
      return true;
    }
    if (/^forget (everything|all)( about me)?$/i.test(t)) { facts = []; save("eva_facts", facts); say("Done. I have forgotten everything I knew about you."); return true; }
    if (/^(clear|reset|delete) (the )?(chat|conversation|history)$/i.test(t)) {
      trans = []; hist = []; save("eva_trans", trans); save("eva_hist", hist); log.innerHTML = ""; say("Chat cleared."); return true;
    }
    m = t.match(/^(?:note|remember)\s*[:,-]?\s+(.+)$/i);
    if (m) { notes.push(m[1]); save("eva_notes", notes); say("Saved: " + m[1]); return true; }
    if (/^(show|list|read)\s+(me\s+)?(my\s+)?notes\b/i.test(t)) {
      say(notes.length ? "Your notes:\n" + notes.map(function (x, i) { return (i + 1) + ". " + x; }).join("\n") : "No notes yet. Say: note, then what to save.");
      return true;
    }
    if (/^(clear|delete)\s+(all\s+)?(my\s+)?notes\b/i.test(t)) { notes = []; save("eva_notes", notes); say("All notes cleared."); return true; }
    return false;
  }

  // ---- built-in greetings (instant, free, no internet needed) ----
  function timeGreet() { var h = new Date().getHours(); return h < 5 ? "Good night" : h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : h < 22 ? "Good evening" : "Good night"; }
  function nm() { var n = $("uname").value.trim(); return n ? ", " + n : ""; }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function greetings(t) {
    var s = t.toLowerCase().replace(/[^a-z\s']/g, " ").replace(/\be v a\b|\beva\b/g, " ").replace(/\s+/g, " ").trim();
    var m;
    if (/^(hi+|hello+|hey+|hey there|hi there|hello there|yo|hola|sup|namaste|hii+)$/.test(s)) {
      say(pick([timeGreet() + nm() + "! How can I help?", "Hello" + nm() + "! What do you need?", "Hey" + nm() + "! I am here.", "Namaste" + nm() + "! What can I do for you?"]));
      return true;
    }
    m = s.match(/^good (morning|afternoon|evening|night)$/);
    if (m) {
      if (m[1] === "morning") { briefing(); return true; }
      var extra = m[1] === "night" ? " Sleep well." : notes.length ? " You have " + notes.length + " saved note" + (notes.length === 1 ? "" : "s") + ". How can I help today?" : " How can I help today?";
      say("Good " + m[1] + nm() + "." + extra);
      return true;
    }
    if (/^(how are you|how are you doing|how r u|how do you do|hows it going|how's it going|what's up|whats up|how have you been)$/.test(s)) {
      say(pick(["Running smoothly and ready to help" + nm() + ". How are you?", "All systems online. What would you like to do?", "Doing great, thanks for asking. How about you?"]));
      return true;
    }
    if (/^(who are you|what are you|what is your name|what's your name|whats your name|your name|introduce yourself|tell me about yourself)$/.test(s)) {
      say("I am E.V.A, your Enhanced Virtual Assistant. I answer questions, search the web, take notes, set reminders, and help you write messages.");
      return true;
    }
    if (/^(what can you do|help|help me|what do you do|your features)$/.test(s)) {
      say("Here is what I can do:\n- Answer questions and look things up\n- Write emails and messages\n- Save notes: say \"note buy milk\", then \"show notes\"\n- Reminders: say \"remind me in 10 minutes to stretch\"\n- Talk with you: press Talk\n- Say \"briefing\" for the date, weather and your notes\n- Say \"remember that ...\" so I get to know you\n- Hands-free: a back-and-forth voice chat");
      return true;
    }
    if (/^(thanks|thank you|thank u|thanks a lot|thx|ty|thank you so much)$/.test(s)) {
      say(pick(["You are welcome" + nm() + "!", "Anytime" + nm() + ".", "Happy to help."]));
      return true;
    }
    if (/^(bye|goodbye|good bye|see you|see ya|talk later|catch you later)$/.test(s)) {
      say("Goodbye" + nm() + ". I will be here when you need me.");
      return true;
    }
    if (/^(what time is it|what is the time|time|what's the time|current time)$/.test(s)) {
      say("It is " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) + ".");
      return true;
    }
    if (/^(what is the date|what's the date|what day is it|what is today|today's date|date today|what's today)$/.test(s)) {
      say("Today is " + new Date().toLocaleDateString([], { weekday: "long", day: "numeric", month: "long", year: "numeric" }) + ".");
      return true;
    }
    if (/^(daily briefing|briefing|brief me|my briefing|morning briefing|give me my briefing)$/.test(s)) { briefing(); return true; }
    if (/^(weather|what's the weather|whats the weather|what is the weather|how's the weather|weather today|will it rain|will it rain today)$/.test(s)) { weatherCmd(); return true; }
    return false;
  }

  // ---- weather (free Open-Meteo, no key) and daily briefing ----
  function wx(c) { return c === 0 ? "clear sky" : c <= 3 ? "partly cloudy" : c <= 48 ? "foggy" : c <= 57 ? "drizzle" : c <= 67 ? "rain" : c <= 77 ? "snow" : c <= 82 ? "rain showers" : c <= 86 ? "snow showers" : "thunderstorms"; }
  async function weather(city) {
    var g = await (await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&name=" + encodeURIComponent(city))).json();
    if (!g.results || !g.results.length) throw new Error("city not found");
    var p = g.results[0];
    var w = await (await fetch("https://api.open-meteo.com/v1/forecast?latitude=" + p.latitude + "&longitude=" + p.longitude +
      "&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=1")).json();
    var c = w.current, d = w.daily;
    return "Weather in " + p.name + ": " + wx(c.weather_code) + ", " + Math.round(c.temperature_2m) + " degrees now. Today ranges from " +
      Math.round(d.temperature_2m_min[0]) + " to " + Math.round(d.temperature_2m_max[0]) + ", with a " + d.precipitation_probability_max[0] + " percent chance of rain.";
  }
  async function weatherCmd() {
    var city = $("city").value.trim();
    if (!city) { say("Tell me your city first. Say: I live in, then your city, or set it in Settings."); return; }
    setState("thinking", "Checking weather");
    try { say(await weather(city)); } catch (e) { setState("", "Ready"); say("I could not get the weather right now. Check the city name and your internet."); }
  }
  async function briefing() {
    setState("thinking", "Preparing briefing");
    var parts = [timeGreet() + nm() + ". Today is " + new Date().toLocaleDateString([], { weekday: "long", day: "numeric", month: "long" }) + "."];
    var city = $("city").value.trim();
    if (city) { try { parts.push(await weather(city)); } catch (e) { parts.push("I could not get the weather right now."); } }
    else parts.push("Add your city in Settings to include the weather.");
    parts.push(notes.length ? "You have " + notes.length + " saved note" + (notes.length === 1 ? "" : "s") + ". Latest: " + notes.slice(-3).reverse().join("; ") + "." : "You have no saved notes.");
    setState("", "Ready");
    say(parts.join("\n"));
  }

  // ---- web lookup (free, no key) ----
  async function wiki(q) {
    try {
      var s = await (await fetch("https://en.wikipedia.org/w/api.php?action=query&list=search&srlimit=2&format=json&origin=*&srsearch=" + encodeURIComponent(q))).json();
      var hits = (s.query && s.query.search) || [], out = [];
      for (var i = 0; i < hits.length; i++) {
        var r = await (await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(hits[i].title))).json();
        if (r.extract) out.push(r.title + ": " + r.extract);
      }
      return out.join("\n");
    } catch (e) { return ""; }
  }

  function sysText() {
    var n = $("uname").value.trim();
    return "You are E.V.A, the Enhanced Virtual Assistant: a calm, quick, friendly personal assistant. Keep answers short and practical, " +
      "usually 1 to 4 sentences, because replies may be spoken aloud. Help with questions, planning, and writing emails or messages. " +
      "If you are unsure, say so." + (n ? " The user's name is " + n + "." : "") +
      " Today is " + new Date().toDateString() + "." + (facts.length ? " Facts about the user: " + facts.join("; ") + "." : "") + (notes.length ? " Saved notes: " + notes.join("; ") + "." : "");
  }

  async function callGemini(q, mode) {
    var ctx = mode === "wiki" ? await wiki(q) : "";
    var text = ctx ? q + "\n\n[Reference notes from Wikipedia, use if relevant]\n" + ctx : q;
    var contents = hist.slice(-12).concat([{ role: "user", parts: [{ text: text }] }]);
    var body = { systemInstruction: { parts: [{ text: sysText() }] }, contents: contents };
    if (mode === "google") body.tools = [{ google_search: {} }];
    var res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent($("model").value.trim()) +
      ":generateContent?key=" + encodeURIComponent($("key").value.trim()),
      { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    var data = await res.json();
    if (!res.ok) throw new Error((data.error && data.error.message) || "HTTP " + res.status);
    var c = data.candidates && data.candidates[0];
    var out = c && c.content && c.content.parts ? c.content.parts.map(function (p) { return p.text || ""; }).join("") : "";
    var src = [];
    var chunks = c && c.groundingMetadata && c.groundingMetadata.groundingChunks;
    if (chunks) chunks.slice(0, 3).forEach(function (g) { if (g.web) src.push(g.web.title || g.web.uri); });
    return { text: out || "I got an empty answer. Try rephrasing.", src: src };
  }

  async function ask(q) {
    if (!$("key").value.trim()) { add("sys err", "Add your free Gemini API key in Settings first."); $("set").open = true; return; }
    setState("thinking", "Thinking");
    var mode = $("search").value, r;
    try {
      try { r = await callGemini(q, mode); }
      catch (e) {
        if (mode !== "google") throw e;
        add("sys", "Google Search is not available on this key. Switching to Wikipedia lookup.");
        $("search").value = "wiki"; save("eva_search", "wiki");
        r = await callGemini(q, "wiki");
      }
      hist.push({ role: "user", parts: [{ text: q }] }, { role: "model", parts: [{ text: r.text }] });
      hist = hist.slice(-20); save("eva_hist", hist);
      var b = add("ai", r.text);
      if (r.src.length) { var s = document.createElement("div"); s.className = "src"; s.textContent = "Sources: " + r.src.join(", "); b.appendChild(s); }
      setState("", "Ready"); speak(r.text);
    } catch (e) {
      setState("", "Error");
      add("sys err", "Could not get an answer: " + e.message);
    }
  }

  function handle(t) {
    t = t.trim(); if (!t) return;
    add("me", t);
    if (!commands(t) && !greetings(t)) ask(t);
  }
  $("form").onsubmit = function (e) { e.preventDefault(); var v = $("text").value; $("text").value = ""; handle(v); };

  trans.forEach(function (x) { add(x.c, x.t, true); });
  add("ai", timeGreet() + nm() + ". I am E.V.A. How can I help?", true);
  add("sys", "Open Settings and paste your free Gemini key to unlock answers. Greetings, notes and reminders work without it.");
  if (!$("key").value) $("set").open = true;
})();
</script>
</body>
</html>
